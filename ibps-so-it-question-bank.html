<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IBPS SO IT Officer — Question Bank</title>
<style>
  :root{
    --bg:#0f1720; --card:#16212c; --card2:#1c2a37; --border:#2a3a48;
    --text:#e8edf2; --muted:#8fa3b3; --accent:#3d8bfd; --accent2:#2a6fd6;
    --correct:#1f8f5f; --correct-bg:#123d2c; --wrong:#d64545; --wrong-bg:#3a1c1c;
    --amber:#e0a52f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;}
  .subtitle{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;}
  .stat b{font-size:16px;display:block;color:var(--text);}
  .stat span{color:var(--muted);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;}
  .tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer;user-select:none;}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab .count{opacity:.7;font-size:11px;}
  .qcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qnum{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;}
  .qtext{font-size:15px;line-height:1.5;margin:0 0 12px;}
  .qtext pre{background:var(--card2);padding:8px 10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0;}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;margin-bottom:7px;font-size:14px;cursor:pointer;transition:background .12s;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct);color:#a7e8c8;}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:#f3b0b0;}
  .opt.disabled{cursor:default;pointer-events:none;}
  .opt.reveal-correct{background:var(--correct-bg);border-color:var(--correct);color:#a7e8c8;}
  .feedback{font-size:12px;margin-top:6px;font-weight:600;}
  .feedback.right{color:var(--correct);}
  .feedback.wrongf{color:var(--wrong);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .progress-track{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--accent);transition:width .2s;}
</style>
</head>
<body>
<div class="wrap">
  <h1>IBPS SO IT Officer — Question Bank</h1>
  <p class="subtitle">Tap an option to check your answer. Categories below.</p>

  <div class="statbar">
    <div class="stat"><b id="stat-answered">0</b><span>Answered</span></div>
    <div class="stat"><b id="stat-correct">0</b><span>Correct</span></div>
    <div class="stat"><b id="stat-accuracy">—</b><span>Accuracy</span></div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <span style="color:var(--muted);font-size:13px;" id="cat-label"></span>
    <button class="btn" id="reset-btn">Reset progress</button>
  </div>

  <div id="questions"></div>
</div>

const state = { current: Object.keys(DATA)[0], answered: {} };
const tabsEl = document.getElementById('tabs');
const qEl = document.getElementById('questions');
const catLabel = document.getElementById('cat-label');

function totalQuestions(){
  return Object.values(DATA).reduce((s,arr)=>s+arr.length,0);
}

function renderTabs(){
  tabsEl.innerHTML = '';
  Object.keys(DATA).forEach(cat=>{
    const t = document.createElement('div');
    t.className = 'tab' + (cat===state.current ? ' active' : '');
    t.innerHTML = cat + ' <span class="count">(' + DATA[cat].length + ')</span>';
    t.onclick = ()=>{ state.current = cat; render(); };
    tabsEl.appendChild(t);
  });
}

function renderQuestions(){
  qEl.innerHTML = '';
  catLabel.textContent = state.current;
  DATA[state.current].forEach((item, idx)=>{
    const key = state.current + '-' + idx;
    const card = document.createElement('div');
    card.className = 'qcard';
    const answeredIdx = state.answered[key];

    let optsHtml = '';
    item.o.forEach((opt, oi)=>{
      let cls = 'opt';
      if(answeredIdx !== undefined){
        cls += ' disabled';
        if(oi === item.a) cls += ' reveal-correct';
        else if(oi === answeredIdx) cls += ' wrong';
      }
      optsHtml += '<button class="'+cls+'" data-key="'+key+'" data-oi="'+oi+'" data-cat="'+state.current+'" data-idx="'+idx+'">'+String.fromCharCode(65+oi)+'. '+opt+'</button>';
    });

    let feedback = '';
    if(answeredIdx !== undefined){
      if(answeredIdx === item.a) feedback = '<div class="feedback right">Correct</div>';
      else feedback = '<div class="feedback wrongf">Incorrect — correct answer highlighted above</div>';
    }

    card.innerHTML =
      '<div class="qmeta"><span class="qnum">Q'+(idx+1)+'</span></div>'+
      '<p class="qtext">'+item.q+'</p>'+
      optsHtml + feedback;
    qEl.appendChild(card);
  });

  qEl.querySelectorAll('.opt:not(.disabled)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      const oi = parseInt(btn.dataset.oi);
      state.answered[key] = oi;
      render();
    });
  });
}

function renderStats(){
  const answeredCount = Object.keys(state.answered).length;
  const correctCount = Object.entries(state.answered).filter(([key, oi])=>{
    const [cat, idxStr] = key.split(/-(?=[^-]+$)/);
    return DATA[cat][parseInt(idxStr)].a === oi;
  }).length;
  document.getElementById('stat-answered').textContent = answeredCount + ' / ' + totalQuestions();
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-accuracy').textContent = answeredCount ? Math.round(100*correctCount/answeredCount)+'%' : '—';
  document.getElementById('progress-fill').style.width = (100*answeredCount/totalQuestions())+'%';
}

function render(){
  renderTabs();
  renderQuestions();
  renderStats();
}

document.getElementById('reset-btn').addEventListener('click', ()=>{
  state.answered = {};
  render();
});

render();
</script>
</body>
</html>
